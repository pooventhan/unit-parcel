name: Deploy to Azure Web App

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: bun install

      - name: Build production bundle
        run: bun run build:prod

      - name: Install production dependencies only
        run: |
          cd apps/api
          bun install --production
          cd ../..

      - name: Make deploy script executable
        run: chmod +x deploy.sh

      - name: Bundle Bun runtime for Azure Linux x64
        run: |
          mkdir -p bin
          BUN_VERSION=$(bun --version | cut -d'+' -f1)
          echo "Downloading Bun v${BUN_VERSION} for Linux x64 (musl)..."
          curl -fsSL "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-linux-x64-musl.zip" -o bun.zip || \
          curl -fsSL "https://github.com/oven-sh/bun/releases/latest/download/bun-linux-x64-musl.zip" -o bun.zip
          unzip -o bun.zip
          mv bun-linux-x64-musl/bun bin/bun
          chmod +x bin/bun
          rm -rf bun.zip bun-linux-x64-musl

      - name: Upload to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .

      - name: Verify deployment
        run: |
          curl -f http://${{ secrets.AZURE_WEBAPP_NAME }}.azurewebsites.net/health || exit 1
